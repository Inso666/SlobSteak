<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
  <!-- US-053: SlobSteak-Markenzeichen. Bewusst aus dem PRD/Produktnamen und den bereits in
       SPEC-00 etablierten Design-Tokens abgeleitet statt neu erfunden (CLAUDE.md Abschnitt 6):
       Kachel in color.background, drei überlappende Kreise in den drei bereits definierten
       Rollenfarben (color.role-pl/ct/ar aus SPEC-00 §1.2) — dieselbe Farbsprache wie das
       Perspektiven-Radar (SPEC-00 §1.3), das die drei Stakeholder-Perspektiven des Produkts
       visualisiert. Die Überlappung steht sinnbildlich für das Zusammenspiel dieser Perspektiven. -->
  <rect width="32" height="32" rx="7" fill="#10151F" />
  <circle cx="16" cy="9.5" r="6" fill="#8B7CF6" fill-opacity="0.9" />
  <circle cx="10.2" cy="19.5" r="6" fill="#2DD4BF" fill-opacity="0.9" />
  <circle cx="21.8" cy="19.5" r="6" fill="#38BDF8" fill-opacity="0.9" />
</svg>
