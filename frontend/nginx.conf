server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # US-009: AuthService/HttpClient rufen relative /api/v1/...-Pfade auf (kein hartkodiertes
    # Backend-Origin im Frontend-Code). In docker-compose laufen frontend (nginx) und api als
    # getrennte Container/Ports — ohne diesen Proxy würde nginx jeden /api/-Request per
    # try_files-Fallback als SPA-Route behandeln und index.html statt JSON zurückliefern.
    # "api" ist der Docker-Compose-Servicename, per interner DNS auflösbar.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Angular-Routing (SPA): unbekannte Pfade an index.html weiterreichen.
        try_files $uri $uri/ /index.html;
    }
}
