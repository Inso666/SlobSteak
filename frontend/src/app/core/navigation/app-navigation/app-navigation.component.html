@if (isVisible()) {
  <ng-template #sidebarContent>
    <!-- US-073 Akzeptanzkriterium 2: Marken-Icon (BrandMarkComponent, alleinige SVG-Quelle)
         zusätzlich zum bestehenden Schriftzug in der Brand-Zeile. -->
    <div class="app-navigation__brand-row">
      <app-brand-mark />
      <span class="app-navigation__brand">SlobSteak</span>
    </div>

    <nav aria-label="Hauptnavigation">
      <ul class="app-navigation__links">
        @for (link of navLinks; track link.route) {
          <li>
            <a [routerLink]="link.route" routerLinkActive="active" (click)="drawerOpen.set(false)">
              <i class="pi {{ link.icon }}" aria-hidden="true"></i>
              <span>{{ link.label }}</span>
            </a>
          </li>
        }
        @if (isAdmin()) {
          <li>
            <a [routerLink]="adminLink.route" routerLinkActive="active" (click)="drawerOpen.set(false)">
              <i class="pi {{ adminLink.icon }}" aria-hidden="true"></i>
              <span>{{ adminLink.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- US-074 Akzeptanzkriterium „Sidebar": Nutzerkarte (Avatar-Initialen + angemeldeter Name)
         unterhalb der Navigationslinks, über „Abmelden" — Daten aus der bereits vorhandenen
         Session (`TokenStorageService.getClaims()?.name`), kein neuer Backend-Request (siehe
         Anmerkungen des Agenten in der Story-Datei zur zugrundeliegenden JWT-Erweiterung). Bleibt
         leer, solange kein Name im Token steckt, statt eine bedeutungslose Initiale zu zeigen. -->
    <div class="app-navigation__user-card">
      @if (currentUserName(); as userName) {
        <span class="app-navigation__avatar" aria-hidden="true">{{ userInitials }}</span>
        <span class="app-navigation__user-name">{{ userName }}</span>
      }
    </div>

    <button type="button" class="app-navigation__logout" (click)="onLogout()">
      <i class="pi pi-sign-out" aria-hidden="true"></i>
      <span>{{ logoutLabel }}</span>
    </button>
  </ng-template>

  @if (isMobileNav()) {
    <!-- US-055 Akzeptanzkriterium 3 / SPEC-02 §1.3: unterhalb 960px klappt die Sidebar zu einem
         `p-drawer` mit Hamburger-Trigger zusammen — identischer Navigations-Inhalt wie die
         Desktop-Sidebar, per `ngTemplateOutlet` wiederverwendet statt dupliziert (Akzeptanzkriterium 4). -->
    <button type="button" class="app-navigation__menu-trigger" (click)="drawerOpen.set(true)" aria-label="Menü öffnen">
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>
    <p-drawer [(visible)]="drawerOpen" position="left">
      <ng-container [ngTemplateOutlet]="sidebarContent" />
    </p-drawer>
  } @else {
    <aside class="app-navigation" aria-label="Hauptnavigation">
      <ng-container [ngTemplateOutlet]="sidebarContent" />
    </aside>
  }
}
