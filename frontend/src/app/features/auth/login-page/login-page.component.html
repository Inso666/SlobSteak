@if (!mustChangePassword) {
  <main class="login">
    <h1>Anmelden</h1>

    @if (sessionExpiredMessage) {
      <p class="session-expired-notice" role="alert">{{ sessionExpiredMessage }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label for="email">E-Mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />

      <label for="password">Passwort</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />

      @if (errorMessage) {
        <p class="form-error">{{ errorMessage }}</p>
      }

      <app-processing-button type="submit" [disabled]="form.invalid" [isSubmitting]="isSubmitting" label="Anmelden" submittingLabel="Wird angemeldet…" />
    </form>
  </main>
} @else {
  <app-password-change-modal (passwordChanged)="onPasswordChanged()" />
}
