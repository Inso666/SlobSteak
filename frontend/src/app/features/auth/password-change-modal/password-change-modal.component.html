<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="password-change-title">
  <div class="modal">
    <h2 id="password-change-title">Passwort ändern</h2>
    <p>Aus Sicherheitsgründen müssen Sie Ihr Passwort ändern, bevor Sie fortfahren können.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label for="new-password">Neues Passwort</label>
      <input id="new-password" type="password" formControlName="newPassword" autocomplete="new-password" />

      @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
        <p class="field-error">Das Passwort muss mindestens 8 Zeichen lang sein.</p>
      }

      @if (errorMessage) {
        <p class="form-error">{{ errorMessage }}</p>
      }

      <app-processing-button type="submit" [isSubmitting]="isSubmitting" label="Passwort ändern" submittingLabel="Wird geändert…" />
    </form>
  </div>
</div>
