<p-dialog
  [visible]="true"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [dismissableMask]="false"
  [draggable]="false"
  [resizable]="false"
  [showHeader]="false"
  [style]="{ width: '26rem', 'max-width': 'calc(100vw - 2rem)' }"
  aria-labelledby="password-change-title"
  role="alertdialog"
>
  <h2 id="password-change-title">Passwort ändern</h2>
  <p>Aus Sicherheitsgründen müssen Sie Ihr Passwort ändern, bevor Sie fortfahren können.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="new-password">Neues Passwort</label>
      <p-password
        inputId="new-password"
        formControlName="newPassword"
        [toggleMask]="true"
        [feedback]="false"
        autocomplete="new-password"
        styleClass="w-full"
        [inputStyle]="{ width: '100%' }"
        [attr.aria-invalid]="form.controls.newPassword.invalid && form.controls.newPassword.touched"
        [attr.aria-describedby]="form.controls.newPassword.invalid && form.controls.newPassword.touched ? 'new-password-error' : null"
      />
      @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
        <p-message id="new-password-error" severity="error" styleClass="w-full" role="alert">Das Passwort muss mindestens 8 Zeichen lang sein.</p-message>
      }
    </div>

    @if (errorMessage) {
      <p-message severity="error" styleClass="w-full" role="alert">{{ errorMessage }}</p-message>
    }

    <app-processing-button type="submit" [isSubmitting]="isSubmitting" label="Passwort ändern" submittingLabel="Wird geändert…" />
  </form>
</p-dialog>
