<div class="workspace">
  @if (loadError) {
    <p class="load-error" role="alert">{{ loadError }}</p>
  }

  @if (project) {
    <header class="workspace-header">
      <h1>{{ project.name }}</h1>
      <!-- SPEC-00 §4: Rolle „User" führt in keinem Screen einen eigenen Rollen-Badge. -->
      @if (roleBadgeClass) {
        <span class="role-badge" [class]="roleBadgeClass">{{ project.role }}</span>
      }
    </header>

    <nav class="tab-pills workspace-tabs" aria-label="Projekt-Workspace-Bereiche">
      <a class="tab-pill" routerLink="stakeholders" routerLinkActive="active">Stakeholder-Liste</a>
      @if (showMapTab) {
        <a class="tab-pill" routerLink="map" routerLinkActive="active">Map</a>
      }
      @if (showDistributionTab) {
        <a class="tab-pill" routerLink="distribution" routerLinkActive="active">Verteiler</a>
      }
    </nav>

    <router-outlet />
  }
</div>
