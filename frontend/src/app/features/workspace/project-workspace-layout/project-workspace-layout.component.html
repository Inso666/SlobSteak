<div class="workspace">
  @if (showLoadError) {
    <p class="load-error" role="alert">{{ loadError }}</p>
  }

  @if (project) {
    <header class="workspace-header">
      <!-- US-081 (Issue #125): einzige `<h1>` je Projekt-Unterseite. `aria-label` ergänzt den
           sichtbaren Projektnamen um den aktiven Bereich (Stakeholder/Map/Verteiler), da die
           vormalige zweite `<h1>` je Kind-Route entfallen ist. -->
      <h1 [attr.aria-label]="headerAriaLabel">{{ project.name }}</h1>
      <!-- SPEC-00 §4: Rolle „User" führt in keinem Screen einen eigenen Rollen-Badge. -->
      @if (roleBadgeClass) {
        <span class="role-badge" [class]="roleBadgeClass">{{ project.role }}</span>
      }
    </header>
  }

  <!-- US-052: außerhalb des `@if (project)`-Blocks, damit die Kind-Route `access-denied` (bzw.
       jede andere Kind-Route) unabhängig davon rendert, ob der eigene, redundante
       `getProject()`-Aufruf dieser Komponente erfolgreich war — vorher blockierte ein
       fehlgeschlagener Aufruf hier das gesamte `router-outlet`, wodurch `AccessDeniedComponent`
       nie sichtbar wurde (siehe Story „Anmerkungen des Agenten"). -->
  <router-outlet />
</div>
