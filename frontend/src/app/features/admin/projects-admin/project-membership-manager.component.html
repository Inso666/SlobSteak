<section class="membership-manager">
  <div class="membership-manager__head">
    <h3>Mitglieder</h3>
    <button type="button" pButton [text]="true" icon="pi pi-plus" (click)="openAssignDialog()">Mitglied hinzufügen</button>
  </div>

  <app-view-state [state]="membershipsState" emptyMessage="Noch keine Mitglieder zugewiesen." [skeletonCount]="2">
    <div class="member-rows" role="list">
      @for (membership of memberships; track membership.userId) {
        <div class="member-row" role="listitem">
          <div class="member-row__data">
            <span class="member-row__name">{{ membership.userName }}</span>
            <span class="member-row__email">{{ membership.userEmail }}</span>
          </div>

          <div class="member-row__role">
            <label class="sr-only" [attr.for]="'role-' + membership.userId">Rolle von {{ membership.userName }}</label>
            <select
              [id]="'role-' + membership.userId"
              [ngModel]="membership.role"
              [ngModelOptions]="{ standalone: true }"
              [disabled]="changingRoleUserIds.has(membership.userId)"
              (ngModelChange)="onChangeRole(membership, $event)"
            >
              @for (role of roles; track role) {
                <option [value]="role">{{ role }}</option>
              }
            </select>
            @if (changingRoleUserIds.has(membership.userId)) {
              <span class="processing-hint">Wird geändert…</span>
            }
          </div>

          <app-processing-button
            type="button"
            [isSubmitting]="removingMemberUserIds.has(membership.userId)"
            label="Entfernen"
            submittingLabel="Wird entfernt…"
            (click)="onRemoveMember(membership)"
          />
        </div>
      }
    </div>
  </app-view-state>

  @if (errorMessage) {
    <p-message severity="error" styleClass="w-full" role="alert">{{ errorMessage }}</p-message>
  }

  <p-dialog header="Mitglied zuweisen" [(visible)]="assignDialogVisible" [modal]="true" [style]="{ width: '26rem', 'max-width': 'calc(100vw - 2rem)' }">
    <form [formGroup]="assignForm" (ngSubmit)="onAssignMember()" class="assign-form">
      <div class="field">
        <label for="userId">Nutzer</label>
        @if (allUsersState === 'loading') {
          <p-skeleton [height]="fieldSkeletonHeight" />
        } @else {
          <select id="userId" formControlName="userId">
            @if (assignableUsers.length === 0) {
              <option value="" disabled selected>Keine weiteren Nutzer verfügbar</option>
            } @else {
              <option value="" disabled>Nutzer wählen…</option>
              @for (user of assignableUsers; track user.id) {
                <option [value]="user.id">{{ user.name }} ({{ user.email }})</option>
              }
            }
          </select>
        }
      </div>

      <div class="field">
        <label for="role">Rolle</label>
        <select id="role" formControlName="role">
          @for (role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </div>
    </form>

    <ng-template #footer>
      <button type="button" pButton [text]="true" (click)="closeAssignDialog()">Abbrechen</button>
      <app-processing-button type="button" [disabled]="assignForm.invalid" [isSubmitting]="isAssigning" label="Hinzufügen" submittingLabel="Wird hinzugefügt…" (click)="onAssignMember()" />
    </ng-template>
  </p-dialog>
</section>
