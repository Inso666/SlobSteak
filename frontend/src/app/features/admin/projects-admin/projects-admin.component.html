<section class="admin-projects">
  @if (loadError) {
    <p class="load-error" role="alert">{{ loadError }}</p>
  }

  <div class="admin-projects__toolbar">
    <button type="button" pButton icon="pi pi-plus" (click)="openCreateDialog()">Projekt anlegen</button>
  </div>

  <app-view-state [state]="projectsState" emptyMessage="Es existieren noch keine Projekte." [skeletonCount]="3">
    <div class="project-cards" role="list">
      @for (project of projects; track project.id) {
        <article class="project-card" role="listitem">
          <div class="project-card__head">
            <span class="project-card__name">{{ project.name }}</span>
            <span class="status-tag" [class.status-tag--archived]="project.status !== 'Active'">{{ project.status }}</span>
          </div>

          <dl class="project-card__data">
            <dt>Mitglieder</dt>
            <dd>{{ project.memberCount }}</dd>
          </dl>

          <div class="project-card__footer">
            <button type="button" pButton [outlined]="true" severity="secondary" (click)="onSelectProject(project)">
              {{ selectedProjectId === project.id ? 'Mitglieder ausblenden' : 'Mitglieder verwalten' }}
            </button>
          </div>

          @if (selectedProjectId === project.id) {
            <app-project-membership-manager [projectId]="project.id" />
          }
        </article>
      }
    </div>
  </app-view-state>

  <p-dialog header="Projekt anlegen" [(visible)]="createDialogVisible" [modal]="true" [style]="{ width: '26rem', 'max-width': 'calc(100vw - 2rem)' }">
    <form [formGroup]="createForm" (ngSubmit)="onCreateProject()">
      <div class="field">
        <label for="name">Name</label>
        <input pInputText id="name" formControlName="name" class="w-full" />
      </div>

      <div class="field">
        <label for="description">Beschreibung</label>
        <input pInputText id="description" formControlName="description" class="w-full" />
      </div>

      @if (createErrorMessage) {
        <p-message severity="error" styleClass="w-full" role="alert">{{ createErrorMessage }}</p-message>
      }
    </form>

    <ng-template #footer>
      <button type="button" pButton [text]="true" (click)="closeCreateDialog()">Abbrechen</button>
      <app-processing-button type="button" [disabled]="createForm.invalid" [isSubmitting]="isCreatingProject" label="Projekt anlegen" submittingLabel="Wird angelegt…" (click)="onCreateProject()" />
    </ng-template>
  </p-dialog>
</section>
