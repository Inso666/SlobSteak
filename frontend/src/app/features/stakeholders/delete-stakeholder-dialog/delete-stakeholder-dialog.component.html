<div class="delete-dialog">
  <p>„{{ stakeholder.name }}“ wirklich löschen?</p>

  @if (impact) {
    <p class="impact">
      Betroffen: {{ impact.assessmentCount }} Assessment(s), {{ impact.communicationAssignmentCount }}
      Kommunikationszuordnung(en). Diese bleiben beim Löschen unverändert erhalten.
    </p>
  }

  @if (errorMessage) {
    <p-message severity="error" styleClass="w-full" role="alert">{{ errorMessage }}</p-message>
  }

  <div class="actions">
    <app-processing-button type="button" [isSubmitting]="isSubmitting" label="Löschen bestätigen" submittingLabel="Wird gelöscht…" (click)="onConfirm()" />
    <button type="button" pButton [outlined]="true" severity="secondary" [disabled]="isSubmitting" (click)="onCancel()">Abbrechen</button>
  </div>
</div>
