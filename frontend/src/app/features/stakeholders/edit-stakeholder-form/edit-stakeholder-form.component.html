<section class="edit-stakeholder">
  <h3>Stakeholder bearbeiten</h3>
  <p class="last-modified">Zuletzt geändert von {{ stakeholder.updatedByName }} am {{ stakeholder.updatedAt | date: 'dd.MM.yyyy, HH:mm' }}</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="edit-name">Name</label>
      <input pInputText id="edit-name" formControlName="name" class="w-full" />
    </div>

    <div class="field">
      <label for="edit-type">Typ</label>
      <select id="edit-type" formControlName="type">
        <option value="Person">Person</option>
        <option value="Organization">Organisation</option>
      </select>
    </div>

    <div class="field">
      <label for="edit-organization">Organisation</label>
      <input pInputText id="edit-organization" formControlName="organization" class="w-full" />
    </div>

    @if (!isOrganization) {
      <div class="field">
        <label for="edit-position">Position/Funktion</label>
        <input pInputText id="edit-position" formControlName="position" class="w-full" />
      </div>
    }

    <div class="field">
      <label for="edit-email">E-Mail</label>
      <input
        pInputText
        id="edit-email"
        type="email"
        formControlName="email"
        class="w-full"
        [class.ng-invalid]="form.controls.email.invalid && form.controls.email.dirty"
        [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.dirty"
        [attr.aria-describedby]="form.controls.email.invalid && form.controls.email.dirty ? 'edit-email-error' : null"
      />
      @if (form.controls.email.invalid && form.controls.email.dirty) {
        <p-message id="edit-email-error" severity="error" styleClass="w-full" role="alert">Ungültiges E-Mail-Format.</p-message>
      }
    </div>

    <div class="field">
      <label for="edit-phone">Telefon</label>
      <input pInputText id="edit-phone" formControlName="phone" class="w-full" />
    </div>

    <div class="field">
      <label for="edit-locationDepartment">Standort/Abteilung</label>
      <input pInputText id="edit-locationDepartment" formControlName="locationDepartment" class="w-full" />
    </div>

    <div class="field">
      <label for="edit-description">Beschreibung</label>
      <textarea pTextarea id="edit-description" formControlName="description" class="w-full" rows="3"></textarea>
    </div>

    @if (errorMessage) {
      <p-message severity="error" styleClass="w-full" role="alert">{{ errorMessage }}</p-message>
    }

    <div class="actions">
      <app-processing-button type="submit" [disabled]="form.invalid" [isSubmitting]="isSubmitting" label="Speichern" submittingLabel="Wird gespeichert…" />
      <button type="button" pButton [outlined]="true" severity="secondary" [disabled]="isSubmitting" (click)="onCancel()">Abbrechen</button>
    </div>
  </form>
</section>
