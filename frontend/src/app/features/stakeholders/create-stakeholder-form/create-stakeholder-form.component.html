<section class="create-stakeholder">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="name">Name</label>
      <input pInputText id="name" formControlName="name" class="w-full" />
    </div>

    <div class="field">
      <label for="type">Typ</label>
      <select id="type" formControlName="type">
        <option value="Person">Person</option>
        <option value="Organization">Organisation</option>
      </select>
    </div>

    <div class="field">
      <label for="organization">Organisation</label>
      <input pInputText id="organization" formControlName="organization" class="w-full" />
    </div>

    @if (!isOrganization) {
      <div class="field">
        <label for="position">Position/Funktion</label>
        <input pInputText id="position" formControlName="position" class="w-full" />
      </div>
    }

    <div class="field">
      <label for="email">E-Mail</label>
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        class="w-full"
        [class.ng-invalid]="form.controls.email.invalid && form.controls.email.dirty"
        [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.dirty"
        [attr.aria-describedby]="form.controls.email.invalid && form.controls.email.dirty ? 'email-error' : null"
      />
      @if (form.controls.email.invalid && form.controls.email.dirty) {
        <p-message id="email-error" severity="error" styleClass="w-full" role="alert">Ungültiges E-Mail-Format.</p-message>
      }
    </div>

    <div class="field">
      <label for="phone">Telefon</label>
      <input pInputText id="phone" formControlName="phone" class="w-full" />
    </div>

    <div class="field">
      <label for="locationDepartment">Standort/Abteilung</label>
      <input pInputText id="locationDepartment" formControlName="locationDepartment" class="w-full" />
    </div>

    <div class="field">
      <label for="description">Beschreibung</label>
      <textarea pTextarea id="description" formControlName="description" class="w-full" rows="3"></textarea>
    </div>

    @if (errorMessage) {
      <p-message severity="error" styleClass="w-full" role="alert">{{ errorMessage }}</p-message>
    }
    @if (lastSimilarWarning) {
      <app-attention-badge [text]="lastSimilarWarning" />
    }

    <app-processing-button type="submit" [disabled]="form.invalid" [isSubmitting]="isSubmitting" label="Anlegen" submittingLabel="Wird angelegt…" />
  </form>
</section>
