<section class="create-stakeholder">
  <h2>Stakeholder anlegen</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label for="name">Name</label>
    <input id="name" formControlName="name" />

    <label for="type">Typ</label>
    <select id="type" formControlName="type">
      <option value="Person">Person</option>
      <option value="Organization">Organisation</option>
    </select>

    <label for="organization">Organisation</label>
    <input id="organization" formControlName="organization" />

    @if (!isOrganization) {
      <label for="position">Position/Funktion</label>
      <input id="position" formControlName="position" />
    }

    <label for="email">E-Mail</label>
    <input id="email" type="email" formControlName="email" />
    @if (form.controls.email.invalid && form.controls.email.dirty) {
      <p class="field-error">Ungültiges E-Mail-Format.</p>
    }

    <label for="phone">Telefon</label>
    <input id="phone" formControlName="phone" />

    <label for="locationDepartment">Standort/Abteilung</label>
    <input id="locationDepartment" formControlName="locationDepartment" />

    <label for="description">Beschreibung</label>
    <textarea id="description" formControlName="description"></textarea>

    @if (errorMessage) {
      <p class="field-error">{{ errorMessage }}</p>
    }
    @if (lastSimilarWarning) {
      <p class="info-message">{{ lastSimilarWarning }}</p>
    }

    <app-processing-button type="submit" [disabled]="form.invalid" [isSubmitting]="isSubmitting" label="Anlegen" submittingLabel="Wird angelegt…" />
  </form>
</section>
