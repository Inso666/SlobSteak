<button
  pButton
  [type]="type"
  [disabled]="disabled || isSubmitting"
  [attr.aria-busy]="isSubmitting"
  class="app-processing-button"
  [class.app-processing-button--full-width]="fullWidth"
>
  @if (isSubmitting) {
    <span class="app-processing-button__spinner" aria-hidden="true"></span>
  }
  <span>{{ isSubmitting ? submittingLabel : label }}</span>
</button>
