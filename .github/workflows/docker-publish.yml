name: Docker Publish

# US-001: Baut und veröffentlicht die Docker-Images für Api und Frontend nach ghcr.io,
# ausschließlich für tatsächlich gemergte Pull Requests auf main (nicht bei geschlossenen,
# aber nicht gemergten PRs und nicht bei direkten Pushes).
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: src/SlobSteak.Api/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short ${{ github.event.pull_request.merge_commit_sha }})" >> "$GITHUB_OUTPUT"

      - name: Image name (lowercase, ghcr.io requirement)
        id: image
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/${{ steps.image.outputs.repo }}-${{ matrix.image }}:latest
            ghcr.io/${{ steps.image.outputs.owner }}/${{ steps.image.outputs.repo }}-${{ matrix.image }}:${{ steps.sha.outputs.short }}
