services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slobsteak}
      POSTGRES_USER: ${POSTGRES_USER:-slobsteak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slobsteak}
    ports:
      - "5432:5432"
    volumes:
      - db-data-ghcr:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-slobsteak} -d $${POSTGRES_DB:-slobsteak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/inso666/slobsteak-api:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-slobsteak};Username=${POSTGRES_USER:-slobsteak};Password=${POSTGRES_PASSWORD:-slobsteak}
    ports:
      - "5000:8080"

  frontend:
    image: ghcr.io/inso666/slobsteak-frontend:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  db-data-ghcr:
